# Local development only — spins up Postgres + Redis + backend + frontend.
# For production we deploy to EKS / RDS (see docs/architecture.md).
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mjh-postgres
    environment:
      POSTGRES_USER: mjh
      POSTGRES_PASSWORD: mjh
      POSTGRES_DB: mjh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mjh -d mjh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mjh-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    container_name: mjh-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://mjh:mjh@postgres:5432/mjh?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-secret-change-me-0123456789
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npm run dev"

  frontend:
    build: ./frontend
    container_name: mjh-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
