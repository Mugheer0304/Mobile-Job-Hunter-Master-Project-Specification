apiVersion: v1
kind: ConfigMap
metadata:
  name: mjh-config
  namespace: mjh
data:
  NODE_ENV: "production"
  PORT: "4000"
  # CORS_ORIGIN is a comma-separated allow-list. A literal `*` reflects the
  # request origin, which is convenient while the frontend's public URL is
  # still a LoadBalancer hostname. Replace with your real frontend origin(s)
  # once you have a fixed domain.
  CORS_ORIGIN: "*"
