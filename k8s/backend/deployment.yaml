apiVersion: apps/v1
kind: Deployment
metadata:
  name: mjh-backend
  namespace: mjh
  labels:
    app: mjh-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mjh-backend
  template:
    metadata:
      labels:
        app: mjh-backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          # Replace "0304mugheer" with your Docker Hub username if different.
          image: docker.io/0304mugheer/mjh-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: mjh-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: mjh-config
                  key: PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: mjh-config
                  key: CORS_ORIGIN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mjh-backend-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mjh-backend-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
